<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Local Blog Editor | Christopher Scott</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="blog.css"><script src="blog-editor.js" defer></script></head>
<body><main class="container blog-editor"><a class="text-link" href="index.html#blog">Back to Blog</a><header class="page-heading"><p class="page-kicker">Local publishing tool</p><h1>Write a post</h1><p class="lead">Paste Markdown or choose a .md file. Save the finished file into your site's <code>posts</code> folder, then run <code>npm run blog:build</code> and refresh the site.</p></header><form id="post-editor"><label for="post-file">Import a Markdown file</label><input id="post-file" type="file" accept=".md,text/markdown,text/plain"><label for="post-title">Title</label><input id="post-title" required maxlength="200"><label for="post-date">Publication date</label><input id="post-date" type="date" required><label for="post-description">Short description (optional)</label><input id="post-description" maxlength="400"><label for="post-body">Markdown</label><textarea id="post-body" rows="22" required spellcheck="false"></textarea><button class="button" type="submit">Save Markdown file</button><p id="editor-status" role="status">This tool works locally in your browser. It does not upload or publish files.</p></form></main></body>
</html>
